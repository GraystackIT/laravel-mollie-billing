name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Reset Composer auth (avoid stale GITHUB_TOKEN)
        run: |
          composer config --global --unset github-oauth.github.com || true

      # Flux Pro is commercial and there is no licence on CI. Both halves have to go: the
      # dev requirement, and the `composer.fluxui.dev` repository — Composer loads every
      # configured repository's package list before it resolves anything, so the repository
      # alone answers 401 and fails the install before a single package is considered.
      #
      # Nothing is lost here. The browser suite is the only thing that needs Flux to render
      # a screen, and it lives behind its own `phpunit.dusk.xml`; `phpunit.xml.dist` lists
      # only tests/Feature and tests/Unit, which pass with Flux absent.
      - name: Drop the commercial browser-suite dependency (no licence on CI)
        run: |
          composer remove --dev livewire/flux-pro --no-update --no-interaction
          composer config --unset repositories.flux-pro

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{}'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: ./vendor/bin/pest --compact
